<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Items — Campus ReShare Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    if(!localStorage.getItem("user")){ window.location.href = "login.html"; }
    if(localStorage.getItem("theme")==="dark") document.documentElement.setAttribute("data-theme","dark");
  </script>

  <!-- ✅ Firebase v8 — MUST load before script.js -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    var firebaseConfig = {
      apiKey:            "AIzaSyAEZf8xbIFCzjHZ5PzzhMFltAOmnluJnwk",
      authDomain:        "campus-reshare.firebaseapp.com",
      databaseURL:       "https://campus-reshare-default-rtdb.firebaseio.com",
      projectId:         "campus-reshare",
      storageBucket:     "campus-reshare.appspot.com",
      messagingSenderId: "182045823730",
      appId:             "1:182045823730:web:fe14335d18c777acaf766b"
    };
    if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
  </script>

  <!-- ✅ EmailJS SDK — needed for match email notifications -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<header class="navbar">
  <div class="logo">ReShare Hub</div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a class="active" href="lost-items.html">Lost Items</a>
    <a href="found-items.html">Found Items</a>
    <a href="found-items.html">Marketplace</a>
    <span id="userEmail" class="user-email"></span>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </nav>
</header>

<div class="lost-items-page">
  <h1>Lost Items</h1>
  <p>Items reported as lost on campus</p>

  <div class="search-filter" style="margin-top:20px">
    <input type="text" id="searchInput" placeholder="Search items..." class="search-box">
    <select id="categoryFilter" class="filter-box">
      <option value="all">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Personal Items">Personal Items</option>
      <option value="Books">Books</option>
      <option value="Accessories">Accessories</option>
      <option value="Clothing">Clothing</option>
      <option value="Others">Others</option>
    </select>
    <button onclick="openForm()" class="report-btn">+ Report Lost Item</button>
  </div>

  <div class="items-grid" id="itemsGrid">
    <p style="color:var(--text-2);padding:10px">⏳ Loading...</p>
  </div>
</div>

<!-- REPORT POPUP -->
<div id="popupForm" class="popup">
  <div class="popup-content modern-form">
    <h2>📦 Report Lost Item</h2>
    <div class="input-group"><span>📝</span><input type="text" id="itemName" placeholder="Item Name"></div>
    <div class="input-group"><span>📂</span>
      <select id="itemCategory">
        <option value="">Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Personal Items">Personal Items</option>
        <option value="Books">Books</option>
        <option value="Accessories">Accessories</option>
        <option value="Clothing">Clothing</option>
        <option value="Others">Others</option>
      </select>
    </div>
    <div class="input-group"><span>📍</span><input type="text" id="itemLocation" placeholder="Last seen location"></div>
    <div class="input-group"><span>👤</span><input type="text" id="contactName" placeholder="Your Name"></div>
    <div class="input-group"><span>📞</span><input type="text" id="contactPhone" placeholder="Phone Number"></div>
    <div class="upload-box">
      <label>📸 Upload Image</label>
      <input type="file" id="itemImage" accept="image/*">
    </div>
    <div class="form-buttons">
      <button onclick="submitForm()" class="submit-btn">🚀 Submit</button>
      <button onclick="closeForm()" class="close-btn">✖ Close</button>
    </div>
  </div>
</div>

<!-- CHAT POPUP -->
<div id="chatBox" class="popup">
  <div class="popup-content chat-popup-content">
    <div class="chat-header">
      <h3 id="chatTitle">💬 Chat</h3>
      <button onclick="closeChat()" class="close-chat-btn">✖</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type a message..." class="chat-input-field">
      <button onclick="sendMessage()" class="send-btn">Send</button>
    </div>
  </div>
</div>

<!-- IMAGE ZOOM MODAL -->
<div id="imageModal" class="image-modal" onclick="if(event.target===this)closeImage()">
  <button onclick="closeImage()" class="close-modal">✕</button>
  <img id="modalImg" class="modal-content" alt="Item Image">
</div>

<!-- ✅ auth.js + script.js AFTER Firebase -->
<script src="auth.js"></script>
<script src="script.js"></script>
<script>
  function toggleTheme(){
    var isDark = document.documentElement.getAttribute("data-theme")==="dark";
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    document.querySelector(".theme-toggle").innerText = next==="dark" ? "☀️" : "🌙";
  }
  if(localStorage.getItem("theme")==="dark")
    document.querySelector(".theme-toggle").innerText = "☀️";
</script>
</body>
</html>
