  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

      databaseURL:       "https://campus-reshare-default-rtdb.firebaseio.com",
      projectId:         "campus-reshare",

<!-- NOTIFICATION BELL STYLES -->
<style>
.notif-bell { position:relative; cursor:pointer; font-size:20px; background:none; border:none; padding:4px 8px; }
.notif-badge { position:absolute; top:0; right:2px; background:#ef4444; color:#fff; font-size:9px; font-weight:800; border-radius:50%; width:16px; height:16px; display:none; align-items:center; justify-content:center; }
.notif-dropdown { display:none; position:absolute; top:42px; right:0; width:320px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,0.15); z-index:9999; overflow:hidden; }
.notif-header { padding:14px 18px; background:#4f46e5; color:#fff; font-weight:700; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
.notif-list { max-height:320px; overflow-y:auto; }
.notif-item { padding:12px 16px; border-bottom:1px solid #f1f5f9; font-size:12.5px; color:#374151; line-height:1.6; background:#fff; }
.notif-item.unread { background:#f0f9ff; border-left:3px solid #4f46e5; }
.notif-item a { display:inline-block; margin-top:6px; background:#25d366; color:#fff; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; text-decoration:none; }
.notif-empty { padding:24px; text-align:center; color:#94a3b8; font-size:13px; }
.notif-wrap { position:relative; display:inline-block; }
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">ReShare Hub</div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="lost-items.html">Lost Items</a>
    <a class="active" href="found-items.html">Found Items</a>
    <a href="found-items.html">Marketplace</a>
    <span id="userEmail" class="user-email"></span>
    <!-- NOTIFICATION BELL -->
    <div class="notif-wrap" id="notifWrap">
      <button class="notif-bell" onclick="toggleNotifDropdown()" title="Notifications">
        🔔
        <span class="notif-badge" id="notifBadge">0</span>
      </button>
      <div class="notif-dropdown" id="notifDropdown">
        <div class="notif-header">
          <span>🔔 Notifications</span>
          <span onclick="markAllRead()" style="font-size:11px;cursor:pointer;opacity:0.85;">Mark all read</span>
        </div>
        <div class="notif-list" id="notifList">
          <div class="notif-empty">No notifications yet</div>
        </div>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </nav>
</header>

<div class="lost-items-page">
  <h1>Found Items</h1>
  <p>Browse items found on campus</p>

  <div class="search-filter" style="margin-top:20px">
    <input type="text" id="searchInput" placeholder="Search items..." class="search-box">
    <select id="categoryFilter" class="filter-box">
      <option value="all">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Personal Items">Personal Items</option>
      <option value="Books">Books</option>
      <option value="Accessories">Accessories</option>
      <option value="Clothing">Clothing</option>
      <option value="Others">Others</option>
    </select>
    <button onclick="openForm()" class="report-btn">+ Report Found Item</button>
  </div>

  <div class="items-grid" id="itemsGrid">
    <p style="color:var(--text-2);padding:10px">⏳ Loading items from Firebase...</p>
  </div>
</div>

<!-- REPORT POPUP -->
<div id="popupForm" class="popup">
  <div class="popup-content modern-form">
    <h2>📦 Report Found Item</h2>
    <div class="input-group"><span>📝</span><input type="text" id="itemName" placeholder="Item Name"></div>
    <div class="input-group"><span>📂</span>
      <select id="itemCategory">
        <option value="">Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Personal Items">Personal Items</option>
        <option value="Books">Books</option>
        <option value="Accessories">Accessories</option>
        <option value="Clothing">Clothing</option>
        <option value="Others">Others</option>
      </select>
    </div>
    <div class="input-group"><span>📍</span><input type="text" id="itemLocation" placeholder="Where you found it"></div>
    <div class="input-group"><span>👤</span><input type="text" id="contactName" placeholder="Your Name"></div>
    <div class="input-group"><span>📞</span><input type="text" id="contactPhone" placeholder="Phone Number"></div>
    <div class="upload-box">
      <label>📸 Upload Image</label>
      <input type="file" id="itemImage" accept="image/*">
    </div>
    <div class="form-buttons">
      <button onclick="submitForm()" class="submit-btn">🚀 Submit</button>
      <button onclick="closeForm()" class="close-btn">✖ Close</button>
    </div>
  </div>
</div>

<!-- CHAT POPUP -->
<div id="chatBox" class="popup">
  <div class="popup-content chat-popup-content">
    <div class="chat-header">
      <h3 id="chatTitle">💬 Chat</h3>
      <button onclick="closeChat()" class="close-chat-btn">✖</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type a message..." class="chat-input-field">
      <button onclick="sendMessage()" class="send-btn">Send</button>
    </div>
  </div>
</div>

<!-- IMAGE ZOOM MODAL -->
<div id="imageModal" class="image-modal" onclick="if(event.target===this)closeImage()">
  <button onclick="closeImage()" class="close-modal">✕</button>
  <img id="modalImg" class="modal-content" alt="Item Image">
</div>

<!-- ✅ auth.js + script.js AFTER Firebase -->
<script src="auth.js"></script>
<script src="script.js"></script>
<script>
  function toggleTheme(){
    var isDark = document.documentElement.getAttribute("data-theme")==="dark";
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    document.querySelector(".theme-toggle").innerText = next==="dark" ? "☀️" : "🌙";
  }
  if(localStorage.getItem("theme")==="dark")
    document.querySelector(".theme-toggle").innerText = "☀️";
</script>

<script>
// ── NOTIFICATION BELL ──
function loadNotifications(){
  var phone = localStorage.getItem("userPhone") || "";
  if(!phone){ return; }
  var cleaned = phone.replace(/\D/g,"");
  if(cleaned.length === 10) cleaned = "91" + cleaned;

  firebase.database().ref("notifications/" + cleaned).on("value", function(snap){
    var list   = document.getElementById("notifList");
    var badge  = document.getElementById("notifBadge");
    if(!snap.exists()){
      list.innerHTML = '<div class="notif-empty">No notifications yet 🎉</div>';
      badge.style.display = "none";
      return;
    }
    var items = [];
    snap.forEach(function(child){
      items.push({ key: child.key, val: child.val() });
    });
    items.reverse(); // newest first

    var unread = items.filter(function(i){ return !i.val.read; }).length;
    badge.textContent = unread;
    badge.style.display = unread > 0 ? "flex" : "none";

    list.innerHTML = "";
    items.forEach(function(item){
      var d = item.val;
      var div = document.createElement("div");
      div.className = "notif-item" + (!d.read ? " unread" : "");
      div.innerHTML =
        "<div style='white-space:pre-line'>" + (d.message || "") + "</div>"
        + (d.waLink ? '<a href="' + d.waLink + '" target="_blank">💬 Open in WhatsApp</a>' : "")
        + "<div style='font-size:10px;color:#94a3b8;margin-top:4px;'>" + (d.time || "") + "</div>";
      list.appendChild(div);
    });
  });
}

function toggleNotifDropdown(){
  var dd = document.getElementById("notifDropdown");
  dd.style.display = dd.style.display === "block" ? "none" : "block";
}

function markAllRead(){
  var phone = localStorage.getItem("userPhone") || "";
  if(!phone) return;
  var cleaned = phone.replace(/\D/g,"");
  if(cleaned.length === 10) cleaned = "91" + cleaned;
  firebase.database().ref("notifications/" + cleaned).once("value", function(snap){
    snap.forEach(function(child){
      firebase.database().ref("notifications/" + cleaned + "/" + child.key + "/read").set(true);
    });
  });
  document.getElementById("notifBadge").style.display = "none";
}

// Close dropdown when clicking outside
document.addEventListener("click", function(e){
  var wrap = document.getElementById("notifWrap");
  if(wrap && !wrap.contains(e.target)){
    document.getElementById("notifDropdown").style.display = "none";
  }
});

window.addEventListener("load", function(){ loadNotifications(); });
</script>

</body>
</html>
